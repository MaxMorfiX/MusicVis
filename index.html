<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Music Visualizer – Core</title>
        <style>
            body {
                font-family: sans-serif;
                margin: 0;
                padding: 1rem;
                background: #1e1e2f;
                color: #eee;
                height: 94vh;
                display: flex;
                flex-direction: column;
            }
            .top-bar {
                margin-bottom: 1rem;
            }
            .main-panel {
                display: flex;
                flex: 1;
                gap: 1rem;
                min-height: 0;
            }
            .blockly-panel {
                flex: 1;
                min-width: 300px;
                background: #2a2a3a;
                border-radius: 8px;
                overflow: hidden;
                display: flex;
                flex-direction: column;
            }
            #blocklyDiv {
                flex: 1;
                height: 100%;
            }
            .canvas-panel {
                flex: 1;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
            }
            canvas {
                background: #000;
                border-radius: 8px;
                box-shadow: 0 4px 6px rgba(0,0,0,0.3);
                width: 100%;
                height: auto;
            }
            button, input {
                margin: 0 0.25rem;
            }
        </style>
        <!-- Blockly scripts -->
        <script src="https://unpkg.com/blockly/blockly.min.js"></script>
        <script src="https://unpkg.com/blockly/blocks_compressed.js"></script>
        <script src="https://unpkg.com/blockly/javascript_compressed.js"></script>
        <script src="https://unpkg.com/blockly/msg/js/en.js"></script>
    </head>
    <body>

    <div class="main-panel">
        <div class="blockly-panel">
            <div id="blocklyDiv"></div>
        </div>
        <div class="canvas-panel">
            <div>
                <input type="file" id="fileInput" accept="audio/*">
                <button id="playBtn" disabled>▶ Play</button>
                <button id="pauseBtn" disabled>⏸ Pause</button>
            </div>
            <canvas id="visualizer" width="600" height="450"></canvas>
        </div>
    </div>

    <!-- Your audio logic from earlier (app.js) would go here, but minimal version is below -->
    <script src="/app.js"></script>
    </body>
</html>
