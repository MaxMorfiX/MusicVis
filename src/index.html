<!--index.html-->

<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>MusicVis</title>
  </head>
  <body>
    <div id="pageContainer">
      <div id="outputPane">
        <!-- <pre id="generatedCode"><code></code></pre> -->
        <div class="music-mini">
            <input type="file" id="musicFile" accept="audio/*">
                <div>
                    <label>Start at (s):</label>
                    <input type="number" id="startTime" value="30" step="1" min="0" style="width: 70px;">
                    <button id="playBtn">▶ Play</button>
                    <button id="stopBtn">⏹ Stop</button>
                    <button id="fullscreenBtn">⛶ Fullscreen</button>
                    <select id="demoSelect">
                        <option value="">-- Choose a demo --</option>
                    </select>
                    <button id="loadDemoBtn">📂 Load Demo</button>
                </div>
            </div>
            <canvas id="canvas" height="250"></canvas>
      </div>
      <div id="blocklyDiv"></div>
    </div>
  </body>
</html>
